# ==================== [CONFIGURACIÓN] ms-flushing ====================
spring.application.name=ms-flushing
# Puerto propio de este microservicio (cada uno usa uno distinto)
server.port=8083

# [BD] H2 en archivo ./data (los datos sobreviven a reinicios). Consola web: http://localhost:8083/h2-console
spring.datasource.url=jdbc:h2:file:./data/ms_flushing;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# [JPA] "update" crea/ajusta las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

