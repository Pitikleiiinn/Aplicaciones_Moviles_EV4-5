# ==================== [CONFIGURACIÓN] ms-temperaturas ====================
spring.application.name=ms-temperaturas
# Puerto propio de este microservicio (cada uno usa uno distinto)
server.port=8082

# [BD] H2 en archivo ./data (los datos sobreviven a reinicios). Consola web: http://localhost:8082/h2-console
spring.datasource.url=jdbc:h2:file:./data/ms_temperaturas;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# [JPA] "update" crea/ajusta las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Alternativa MySQL (descomentar y agregar la dependencia mysql-connector-j al pom) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/ms_temperaturas?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=TU_CLAVE
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==================== [REGLAS DE NEGOCIO] Umbrales de temperatura del agua (°C) ====================
# Mismos límites que la app: < 27 Normal | 27 a 29,9 Advertencia | >= 30 Crítico
ariztia.temperatura.advertencia=27
ariztia.temperatura.critico=30
